<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle de pedido — Panel Administrador</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="admin-body">

  <div class="admin-wrapper">
    <aside class="admin-sidebar">
      <div class="admin-brand">Gas <span>El Volcán</span><br><small>Panel interno</small></div>
      <nav id="admin-menu" class="admin-nav"></nav>
      <div class="admin-sidebar-footer">
        <div id="admin-usuario-actual" class="small text-white-50 mb-2"></div>
        <a href="../index.html" class="btn btn-outline-light btn-sm w-100 mb-2">Ver tienda</a>
        <button id="btn-cerrar-sesion-admin" class="btn btn-outline-light btn-sm w-100">Cerrar sesión</button>
      </div>
    </aside>

    <main class="admin-content">
      <div id="pedido-no-encontrado" class="text-center text-secondary border rounded p-5 bg-white d-none">
        <p>No encontramos el pedido solicitado.</p>
        <a href="pedidos.html" class="btn btn-flame mt-2">Volver al listado</a>
      </div>

      <div id="pedido-contenido">
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
          <h1 class="h3 mb-0">Pedido <span id="pedido-id"></span></h1>
          <a href="pedidos.html" class="btn btn-outline-secondary">Volver</a>
        </div>

        <div class="card border-0 shadow-sm p-4 mb-3">
          <dl class="row mb-0">
            <dt class="col-sm-3">Fecha</dt><dd class="col-sm-9" id="pedido-fecha"></dd>
            <dt class="col-sm-3">Cliente</dt><dd class="col-sm-9" id="pedido-cliente"></dd>
            <dt class="col-sm-3">Correo</dt><dd class="col-sm-9" id="pedido-correo"></dd>
            <dt class="col-sm-3">Estado</dt><dd class="col-sm-9" id="pedido-estado"></dd>
          </dl>
        </div>

        <div class="card border-0 shadow-sm">
          <div class="table-responsive">
            <table class="table align-middle mb-0">
              <thead>
                <tr><th>Producto</th><th>Cantidad</th><th>Precio unitario</th><th>Subtotal</th></tr>
              </thead>
              <tbody id="pedido-items"></tbody>
            </table>
          </div>
          <div class="p-3 border-top text-end">
            <div>Subtotal: <span id="pedido-subtotal"></span></div>
            <div id="pedido-fila-descuento">Descuento (<span id="pedido-cupon"></span>): <span id="pedido-descuento" class="text-success"></span></div>
            <div class="fs-5 fw-bold">Total: <span id="pedido-total"></span></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/validaciones.js"></script>
  <script src="../js/admin/admin-ui.js"></script>
  <script src="../js/admin/admin-pedido-detalle.js"></script>
</body>
</html>
