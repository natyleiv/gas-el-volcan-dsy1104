<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuevo/Editar producto — Panel Administrador</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="admin-body">

  <div class="admin-wrapper">
    <aside class="admin-sidebar">
      <div class="admin-brand">Gas <span>El Volcán</span><br><small>Panel interno</small></div>
      <nav id="admin-menu" class="admin-nav"></nav>
      <div class="admin-sidebar-footer">
        <div id="admin-usuario-actual" class="small text-white-50 mb-2"></div>
        <a href="../index.html" class="btn btn-outline-light btn-sm w-100 mb-2">Ver tienda</a>
        <button id="btn-cerrar-sesion-admin" class="btn btn-outline-light btn-sm w-100">Cerrar sesión</button>
      </div>
    </aside>

    <main class="admin-content">
      <h1 id="titulo-formulario" class="h3 mb-3">Nuevo producto</h1>

      <div class="card border-0 shadow-sm p-4" style="max-width: 720px;">
        <div id="mensaje-producto" class="alert d-none" role="alert"></div>

        <form id="form-producto" novalidate>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="codigo" class="form-label">Código de producto</label>
              <input type="text" class="form-control" id="codigo" minlength="3">
              <div class="invalid-feedback" id="codigo-feedback"></div>
            </div>
            <div class="col-md-6 mb-3">
              <label for="categoria" class="form-label">Categoría</label>
              <select id="categoria" class="form-select">
                <option value="">Selecciona una categoría</option>
              </select>
              <div class="invalid-feedback" id="categoria-feedback"></div>
            </div>
          </div>

          <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="nombre" maxlength="100">
            <div class="invalid-feedback" id="nombre-feedback"></div>
          </div>

          <div class="mb-3">
            <label for="descripcion" class="form-label">Descripción <span class="text-secondary small">(opcional)</span></label>
            <textarea class="form-control" id="descripcion" rows="3" maxlength="500"></textarea>
            <div class="invalid-feedback" id="descripcion-feedback"></div>
          </div>

          <div class="row">
            <div class="col-md-4 mb-3">
              <label for="precio" class="form-label">Precio</label>
              <input type="number" class="form-control" id="precio" min="0" step="0.01">
              <div class="form-text">Mínimo 0 (se considera producto gratis).</div>
              <div class="invalid-feedback" id="precio-feedback"></div>
            </div>
            <div class="col-md-4 mb-3">
              <label for="stock" class="form-label">Stock</label>
              <input type="number" class="form-control" id="stock" min="0" step="1">
              <div class="invalid-feedback" id="stock-feedback"></div>
            </div>
            <div class="col-md-4 mb-3">
              <label for="stock-critico" class="form-label">Stock crítico <span class="text-secondary small">(opcional)</span></label>
              <input type="number" class="form-control" id="stock-critico" min="0" step="1">
              <div class="invalid-feedback" id="stock-critico-feedback"></div>
            </div>
          </div>

          <div class="mb-4">
            <label for="imagen" class="form-label">URL de imagen <span class="text-secondary small">(opcional)</span></label>
            <input type="text" class="form-control" id="imagen" placeholder="https://...">
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-flame">Guardar producto</button>
            <a href="productos.html" class="btn btn-outline-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/validaciones.js"></script>
  <script src="../js/admin/admin-ui.js"></script>
  <script src="../js/admin/admin-producto-form.js"></script>
</body>
</html>
