<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle de producto — Panel Administrador</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="admin-body">

  <div class="admin-wrapper">
    <aside class="admin-sidebar">
      <div class="admin-brand">Gas <span>El Volcán</span><br><small>Panel interno</small></div>
      <nav id="admin-menu" class="admin-nav"></nav>
      <div class="admin-sidebar-footer">
        <div id="admin-usuario-actual" class="small text-white-50 mb-2"></div>
        <a href="../index.html" class="btn btn-outline-light btn-sm w-100 mb-2">Ver tienda</a>
        <button id="btn-cerrar-sesion-admin" class="btn btn-outline-light btn-sm w-100">Cerrar sesión</button>
      </div>
    </aside>

    <main class="admin-content">
      <div id="producto-no-encontrado" class="text-center text-secondary border rounded p-5 bg-white d-none">
        <p>No encontramos el producto solicitado.</p>
        <a href="productos.html" class="btn btn-flame mt-2">Volver al listado</a>
      </div>

      <div id="producto-contenido">
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
          <h1 class="h3 mb-0">Detalle de producto</h1>
          <div class="d-flex gap-2">
            <a href="productos.html" class="btn btn-outline-secondary">Volver</a>
            <a href="#" id="link-editar" class="btn btn-flame">Editar</a>
          </div>
        </div>

        <div class="card border-0 shadow-sm p-4">
          <div class="row g-4">
            <div class="col-md-4">
              <img id="mostrar-imagen" src="" alt="" class="img-fluid rounded">
            </div>
            <div class="col-md-8">
              <dl class="row mb-0">
                <dt class="col-sm-4">Código</dt><dd class="col-sm-8" id="mostrar-codigo"></dd>
                <dt class="col-sm-4">Nombre</dt><dd class="col-sm-8" id="mostrar-nombre"></dd>
                <dt class="col-sm-4">Categoría</dt><dd class="col-sm-8" id="mostrar-categoria"></dd>
                <dt class="col-sm-4">Precio</dt><dd class="col-sm-8" id="mostrar-precio"></dd>
                <dt class="col-sm-4">Stock</dt><dd class="col-sm-8" id="mostrar-stock"></dd>
                <dt class="col-sm-4">Stock crítico</dt><dd class="col-sm-8" id="mostrar-stock-critico"></dd>
                <dt class="col-sm-4">Descripción</dt><dd class="col-sm-8" id="mostrar-descripcion"></dd>
              </dl>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/validaciones.js"></script>
  <script src="../js/admin/admin-ui.js"></script>
  <script src="../js/admin/admin-producto-mostrar.js"></script>
</body>
</html>
