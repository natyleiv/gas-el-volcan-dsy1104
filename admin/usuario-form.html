<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuevo/Editar usuario — Panel Administrador</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="admin-body">

  <div class="admin-wrapper">
    <aside class="admin-sidebar">
      <div class="admin-brand">Gas <span>El Volcán</span><br><small>Panel interno</small></div>
      <nav id="admin-menu" class="admin-nav"></nav>
      <div class="admin-sidebar-footer">
        <div id="admin-usuario-actual" class="small text-white-50 mb-2"></div>
        <a href="../index.html" class="btn btn-outline-light btn-sm w-100 mb-2">Ver tienda</a>
        <button id="btn-cerrar-sesion-admin" class="btn btn-outline-light btn-sm w-100">Cerrar sesión</button>
      </div>
    </aside>

    <main class="admin-content">
      <h1 id="titulo-formulario" class="h3 mb-3">Nuevo usuario</h1>

      <div class="card border-0 shadow-sm p-4" style="max-width: 760px;">
        <div id="mensaje-usuario" class="alert d-none" role="alert"></div>

        <form id="form-usuario" novalidate>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="run" class="form-label">RUN <span class="text-secondary small">(sin puntos ni guion)</span></label>
              <input type="text" class="form-control" id="run" maxlength="9">
              <div class="invalid-feedback" id="run-feedback"></div>
            </div>
            <div class="col-md-6 mb-3">
              <label for="tipo-usuario" class="form-label">Tipo de usuario</label>
              <select id="tipo-usuario" class="form-select">
                <option value="">Selecciona un tipo</option>
              </select>
              <div class="invalid-feedback" id="tipo-usuario-feedback"></div>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="nombre" class="form-label">Nombre</label>
              <input type="text" class="form-control" id="nombre" maxlength="50">
              <div class="invalid-feedback" id="nombre-feedback"></div>
            </div>
            <div class="col-md-6 mb-3">
              <label for="apellidos" class="form-label">Apellidos</label>
              <input type="text" class="form-control" id="apellidos" maxlength="100">
              <div class="invalid-feedback" id="apellidos-feedback"></div>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="correo" class="form-label">Correo electrónico</label>
              <input type="email" class="form-control" id="correo" maxlength="100">
              <div class="invalid-feedback" id="correo-feedback"></div>
            </div>
            <div class="col-md-6 mb-3">
              <label for="telefono" class="form-label">Teléfono <span class="text-secondary small">(opcional)</span></label>
              <input type="tel" class="form-control" id="telefono">
            </div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="password" class="form-label">Contraseña</label>
              <input type="password" class="form-control" id="password" maxlength="10">
              <div class="form-text" id="password-ayuda">Entre 4 y 10 caracteres.</div>
              <div class="invalid-feedback" id="password-feedback"></div>
            </div>
            <div class="col-md-6 mb-3">
              <label for="confirmar-password" class="form-label">Confirmar contraseña</label>
              <input type="password" class="form-control" id="confirmar-password" maxlength="10">
              <div class="invalid-feedback" id="confirmar-password-feedback"></div>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="fecha-nacimiento" class="form-label">Fecha de nacimiento <span class="text-secondary small">(opcional)</span></label>
              <input type="date" class="form-control" id="fecha-nacimiento">
            </div>
            <div class="col-md-6 mb-3">
              <label for="direccion" class="form-label">Dirección</label>
              <input type="text" class="form-control" id="direccion" maxlength="300">
              <div class="invalid-feedback" id="direccion-feedback"></div>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="region" class="form-label">Región</label>
              <select id="region" class="form-select">
                <option value="">Selecciona una región</option>
              </select>
              <div class="invalid-feedback" id="region-feedback"></div>
            </div>
            <div class="col-md-6 mb-3">
              <label for="comuna" class="form-label">Comuna</label>
              <select id="comuna" class="form-select" disabled>
                <option value="">Selecciona primero la región</option>
              </select>
              <div class="invalid-feedback" id="comuna-feedback"></div>
            </div>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-flame">Guardar usuario</button>
            <a href="usuarios.html" class="btn btn-outline-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/validaciones.js"></script>
  <script src="../js/admin/admin-ui.js"></script>
  <script src="../js/admin/admin-usuario-form.js"></script>
</body>
</html>
