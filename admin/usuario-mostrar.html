<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle de usuario — Panel Administrador</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="admin-body">

  <div class="admin-wrapper">
    <aside class="admin-sidebar">
      <div class="admin-brand">Gas <span>El Volcán</span><br><small>Panel interno</small></div>
      <nav id="admin-menu" class="admin-nav"></nav>
      <div class="admin-sidebar-footer">
        <div id="admin-usuario-actual" class="small text-white-50 mb-2"></div>
        <a href="../index.html" class="btn btn-outline-light btn-sm w-100 mb-2">Ver tienda</a>
        <button id="btn-cerrar-sesion-admin" class="btn btn-outline-light btn-sm w-100">Cerrar sesión</button>
      </div>
    </aside>

    <main class="admin-content">
      <div id="usuario-no-encontrado" class="text-center text-secondary border rounded p-5 bg-white d-none">
        <p>No encontramos el usuario solicitado.</p>
        <a href="usuarios.html" class="btn btn-flame mt-2">Volver al listado</a>
      </div>

      <div id="usuario-contenido">
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
          <h1 class="h3 mb-0">Detalle de usuario</h1>
          <div class="d-flex gap-2">
            <a href="usuarios.html" class="btn btn-outline-secondary">Volver</a>
            <a href="usuario-form.html" class="btn btn-flame">Editar</a>
          </div>
        </div>

        <div class="card border-0 shadow-sm p-4">
          <dl class="row mb-0">
            <dt class="col-sm-3">RUN</dt><dd class="col-sm-9" id="mostrar-run"></dd>
            <dt class="col-sm-3">Nombre completo</dt><dd class="col-sm-9" id="mostrar-nombre"></dd>
            <dt class="col-sm-3">Correo</dt><dd class="col-sm-9" id="mostrar-correo"></dd>
            <dt class="col-sm-3">Teléfono</dt><dd class="col-sm-9" id="mostrar-telefono"></dd>
            <dt class="col-sm-3">Tipo de usuario</dt><dd class="col-sm-9" id="mostrar-tipo"></dd>
            <dt class="col-sm-3">Fecha de nacimiento</dt><dd class="col-sm-9" id="mostrar-fecha-nacimiento"></dd>
            <dt class="col-sm-3">Región / Comuna</dt><dd class="col-sm-9" id="mostrar-region-comuna"></dd>
            <dt class="col-sm-3">Dirección</dt><dd class="col-sm-9" id="mostrar-direccion"></dd>
            <dt class="col-sm-3">Estado de la cuenta</dt><dd class="col-sm-9" id="mostrar-estado"></dd>
          </dl>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/validaciones.js"></script>
  <script src="../js/admin/admin-ui.js"></script>
  <script src="../js/admin/admin-usuario-mostrar.js"></script>
</body>
</html>
